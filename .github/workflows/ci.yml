name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Check KUI library (host)
        run: cargo check -p kense-kui
      - name: Check KUI library (wasm32)
        run: cargo check -p kense-kui --target wasm32-unknown-unknown --no-default-features
      - name: Check web (wasm32)
        run: cargo check -p kui-web --target wasm32-unknown-unknown
      - name: Test KUI story
        run: cargo test -p kui-story
      - name: Build registry JSON
        run: cargo run -p kui-build -- build && cargo run -p kui-build -- verify-preview
      - name: Check CLI
        run: cargo check -p kui-cli
