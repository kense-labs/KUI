[workspace]
resolver = "2"
members = [
    "registry",
    "apps/story",
    "apps/web",
    "website/site",
    "website/client",
    "tools/cli",
    "tools/catalog",
    "tools/registry-build",
    "templates/app",
]
default-members = ["apps/story"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"
repository = "https://github.com/kense-labs/KUI"

[workspace.dependencies]
# Exact pin — do not widen to caret ranges.
gpui = { package = "gpui-pre", version = "=0.3.10", default-features = false }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", default-features = false }
gpui_web = { package = "gpui-pre-web", version = "=0.3.10", default-features = false }
kui = { package = "kense-kui", path = "registry", version = "0.1.0", default-features = false }
kui-story = { path = "apps/story", version = "0.1.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
walkdir = "2"
sha2 = "0.10"
hex = "0.4"
ureq = { version = "2", features = ["json"] }

[profile.dev]
debug = "limited"
