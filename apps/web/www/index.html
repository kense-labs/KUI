<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KUI — Component gallery (WASM)</title>
    <link rel="modulepreload" href="./pkg/kui_web.js" />
    <script>
      try {
        document.documentElement.dataset.theme = window.frameElement?.ownerDocument.documentElement.dataset.theme
          || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      } catch {}
    </script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f5f5f5;
        color: CanvasText;
        font: 14px/1.4 system-ui, sans-serif;
      }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #242424; }
      html:is([data-story="swipe-actions"], [data-story="resizable-panels"], [data-story="glass-segmented"], [data-story="ask-your-data"], [data-story="ruler-slider"], [data-story="rating"], [data-story="dock"], [data-story="liquid-tab-bar"], [data-story="holo-card"], [data-story="typewriter-terminal"], [data-story="charge-session"], [data-story="cover-flow"], [data-story="ticket-tear"], [data-story="orbit-logos"]) canvas { touch-action: pan-y pinch-zoom !important; }
      html[data-embedded-story]:is([data-story="team-switcher"], [data-story="phone-input"]) canvas { touch-action: pan-y pinch-zoom !important; }
      html[data-embedded-story]:is([data-story="orbit-menu"], [data-story="control-center"], [data-story="mega-menu-morph"], [data-story="morph-select"], [data-story="rich-text-editor"], [data-story="date-reel"], [data-story="stretch-refresh"]) canvas { touch-action: pan-y pinch-zoom !important; }
      #status {
        position: absolute; inset: 0; pointer-events: none;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 12px; padding: 24px; color: #737373; text-align: center;
        font-size: 13px; font-weight: 400;
        animation: loading-appear 180ms ease-out 420ms both;
      }
      html[data-theme="dark"] #status { color: #a3a3a3; }
      #status[hidden] { display: none; }
      #status::before {
        content: ""; width: 26px; height: 8px;
        background: radial-gradient(circle, currentColor 2px, transparent 2.5px) left center / 9px 8px repeat-x;
        animation: loading-breathe 1100ms ease-in-out infinite alternate;
      }
      html[data-preview-error] #status { animation: none; opacity: 1; }
      html[data-preview-error] #status::before { display: none; }
      @keyframes loading-appear { from { opacity: 0; } to { opacity: 1; } }
      @keyframes loading-breathe { from { opacity: .35; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #status, #status::before { animation: none; } }
      canvas {
        display: block;
      }
      html[data-preview-error] canvas { visibility: hidden; }
    </style>
  </head>
  <body aria-busy="true">
    <!-- Boot feedback must render before the WASM module downloads. -->
    <div id="status" role="status" aria-live="polite">Loading preview…</div>
    <script type="module" src="./preview.js"></script>
  </body>
</html>
