[package]
name = "kui"
description = "KUI registry source — the same tree the kui CLI copies into applications"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = ["test-support"]
# Desktop/CI test harness. Do not enable for wasm32 (pulls host-only crates).
test-support = ["gpui/test-support"]
# Optional platform hooks for native hosts that embed kui helpers.
native = ["dep:gpui_platform"]
# Marker feature: same source compiles for wasm32; runtime is gpui_platform's wasm backend.
web = []

[dependencies]
gpui = { workspace = true, default-features = false }
gpui_platform = { workspace = true, optional = true }

[dev-dependencies]
gpui = { workspace = true, default-features = false, features = ["test-support"] }
