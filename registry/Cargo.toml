[package]
name = "kense-kui"
description = "KUI components for GPUI on native desktop and WASM web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://kense-labs.github.io/kui/"
documentation = "https://docs.rs/kense-kui"
readme = "README.md"
keywords = ["gpui", "ui", "components", "desktop", "wasm"]
categories = ["gui", "wasm"]
publish = ["crates-io"]

[lib]
name = "kui"

[package.metadata.docs.rs]
no-default-features = true
features = ["web"]

[features]
default = ["test-support"]
# Desktop/CI test harness. Do not enable for wasm32 (pulls host-only crates).
test-support = ["gpui/test-support"]
# Optional platform hooks for native hosts that embed kui helpers.
native = ["dep:gpui_platform"]
# Semantic HTML controls; shared GPUI controls compile for wasm32 without this feature.
web = []

[dependencies]
gpui = { workspace = true, default-features = false }
gpui_platform = { workspace = true, optional = true }

web-time = "1"
unicode-segmentation = "1"
serde_json.workspace = true


[dev-dependencies]
gpui = { workspace = true, default-features = false, features = ["test-support"] }

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
